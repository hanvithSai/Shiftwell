<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiftwell Swap Rules | Prototype</title>
<style>
:root{--ink:#1b2430;--muted:#5f6b7a;--line:#dfe4ea;--bg:#eef1f5;--card:#fff;--accent:#1f4fd8;--accent-bg:#eaf0ff;
--auto:#157a55;--auto-bg:#e5f5ed;--mgr:#4b5563;--mgr-bg:#eceff3;--appr:#9a5a06;--appr-bg:#fdf1d9;--block:#b42318;--block-bg:#fdeae8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button{font:inherit;cursor:pointer}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px}.brand span{color:var(--muted);font-weight:400}
.seg{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px #0002}
.top label{color:var(--muted);font-size:12px;margin-right:6px}
.top select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff}
.stage{display:grid;grid-template-columns:270px minmax(0,1fr) 270px;gap:18px;padding:18px 20px;max-width:1500px;margin:0 auto;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr) 270px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sp{display:inline-block;background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:11px;padding:2px 8px;border-radius:99px}
.note b{display:block;font-size:14px;margin:6px 0 4px}.note p{margin:4px 0;color:#38424f;font-size:13px}
.note ul{margin:4px 0 4px 16px;padding:0;font-size:13px;color:#38424f}
.ev{font-size:12.5px;border-top:1px solid var(--line);padding:7px 0}.ev:first-of-type{border-top:0}
.ev i{font-style:normal;color:var(--muted);font-size:11px;display:block}
.ev .ch{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--mgr-bg);color:var(--mgr);margin-right:4px}
.empty{color:var(--muted);font-size:12.5px}
/* phone */
.phone{width:372px;height:740px;margin:0 auto;border:10px solid #1b2430;border-radius:38px;background:#f6f7f9;display:flex;flex-direction:column;overflow:hidden;position:relative}
.sbar{height:26px;background:#fff;display:flex;justify-content:space-between;padding:6px 18px 0;font-size:11px;color:var(--muted)}
.appbar{background:#fff;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.appbar h3{margin:0;font-size:17px}.appbar small{color:var(--muted)}
.back{border:0;background:none;color:var(--accent);padding:0;margin-bottom:2px;font-size:13px}
.body{flex:1;overflow:auto;padding:12px 14px}
.nav{display:flex;background:#fff;border-top:1px solid var(--line)}
.nav button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:12px;color:var(--muted);position:relative}
.nav button.on{color:var(--accent);font-weight:700}
.nav .bd{position:absolute;top:4px;margin-left:4px;background:var(--block);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px}
.card .t{font-weight:600}.card .s{color:var(--muted);font-size:12.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.c-auto{background:var(--auto-bg);color:var(--auto)}.c-mgr{background:var(--mgr-bg);color:var(--mgr)}
.c-appr{background:var(--appr-bg);color:var(--appr)}.c-block{background:var(--block-bg);color:var(--block)}.c-info{background:var(--accent-bg);color:var(--accent)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ok{background:var(--auto);border-color:var(--auto);color:#fff}
.btn.bad{color:var(--block);border-color:#f0c2be}.btn.full{width:100%;padding:11px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;margin-top:9px}.btns .btn{flex:1}
.banner{border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13px}
.ban-warn{background:var(--appr-bg);color:var(--appr)}.ban-bad{background:var(--block-bg);color:var(--block)}.ban-ok{background:var(--auto-bg);color:var(--auto)}
.pick{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pick.dis{background:#f3f4f6;cursor:not-allowed}.pick:not(.dis):hover{border-color:var(--accent)}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.result{border-radius:14px;padding:16px;text-align:center;margin:6px 0 12px}
.result b{display:block;font-size:18px}.result .ic{font-size:30px}
.r-auto{background:var(--auto-bg);color:var(--auto)}.r-mgr{background:var(--mgr-bg);color:var(--mgr)}.r-appr{background:var(--appr-bg);color:var(--appr)}.r-block{background:var(--block-bg);color:var(--block)}.r-wait{background:var(--accent-bg);color:var(--accent)}
.tl{margin:8px 0 8px 4px}.tl div{position:relative;padding:0 0 12px 22px;border-left:2px solid var(--line);margin-left:6px;font-size:13px}

.tl div.d:before{background:var(--auto);border-color:var(--auto)}.tl div.n:before{background:var(--accent);border-color:var(--accent)}
.chk{display:flex;gap:8px;padding:4px 0;font-size:13px}.dot{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;color:#fff;font-size:10px;line-height:16px;text-align:center}
.d-ok{background:var(--auto)}.d-warn{background:#c98a0a}.d-fail{background:var(--block)}.d-off{background:#aab3bf}
.hb{height:8px;border-radius:5px;background:var(--mgr-bg);position:relative;margin:6px 0 2px}
.hb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}.hb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--block)}
.stbtn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
.stbtn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.demo{border:1px dashed #98a4b5;border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted);margin-top:8px}
/* web */
.web{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wbar{background:#e8ebf0;padding:8px 12px;display:flex;gap:6px;align-items:center}
.wbar i{width:10px;height:10px;border-radius:50%;background:#c3c9d2}.wbar span{margin-left:10px;background:#fff;border-radius:6px;padding:2px 12px;font-size:12px;color:var(--muted);flex:1;max-width:420px}
.wgrid{display:grid;grid-template-columns:190px 1fr;min-height:640px}
.side{background:#f7f8fa;border-right:1px solid var(--line);padding:14px 10px}
.side b{display:block;padding:2px 8px 10px;font-size:15px}
.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--muted)}
.side button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px #0001}
.wm{padding:18px 22px}.wm h2{margin:0 0 3px;font-size:19px}.wm .lead{color:var(--muted);margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 330px;gap:16px}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.sec h3{margin:0 0 6px;font-size:14px}.sec p.h{margin:0 0 8px;color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:5px 7px;border-bottom:1px solid var(--line)}
td{padding:6px 7px;border-bottom:1px solid #eef1f4;vertical-align:top}
.f{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}.f label{font-size:13px}
.f input[type=number],.f select,.f input[type=text],textarea{padding:5px 8px;border:1px solid #c9d0d9;border-radius:7px;font:inherit}
.f input[type=number]{width:70px}
.tg{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.impact b{font-size:22px}.imp{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.imp div{flex:1;min-width:70px;border-radius:9px;padding:8px;text-align:center}
.imp span{display:block;font-size:11px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}
.modal .box{background:#fff;border-radius:12px;padding:18px;width:420px;max-width:92vw}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:10}
/* spec */
.spec{max-width:1100px;margin:18px auto;padding:0 20px}
.spec .panel{margin-bottom:14px}.spec h2{margin:0 0 4px;font-size:18px}.spec h3{margin:14px 0 4px;font-size:14px}
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin:10px 0}
.fb{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;font-size:12.5px;flex:1;min-width:130px}.fb b{display:block;font-size:12.5px}
.fb.eng{background:var(--accent-bg);border-color:#b9c9f5}.ar{align-self:center;color:var(--muted)}
.spec .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.spec code{background:#f1f3f6;padding:1px 5px;border-radius:4px;font-size:12px}
@media(max-width:1100px){.stage,.stage.wide{grid-template-columns:1fr}.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">Shiftwell <span>Swap Rules · Prototype</span></div>
  <div><label>Customer</label><select id="scSel"></select></div>
  <div><label>Release</label><select id="relSel"><option value="1">Sprint 1: credential gate</option><option value="2">Sprints 2–3: rules engine</option><option value="4" selected>Sprint 4+: full</option></select></div>
  <div class="seg" id="persona"></div>
  <div class="sub" style="margin:0">Demo date: Fri 20 Nov 2026</div>
  <button class="btn" id="resetBtn" style="margin-left:auto">Reset demo</button>
</div>
<div id="app"></div>
<div id="modalRoot"></div>

<script>
// =============== data ===============
const WEEK0='2026-11-23', TODAY='2026-11-20';
const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function dd(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
const iso=day=>addDays(WEEK0,day);
const dlabel=day=>DAYN[day]+' '+(23+day>30?23+day-30:23+day)+' Nov';
const hh=n=>String(n%24).padStart(2,'0')+':00';

const SC={
 freshbowl:{name:'FreshBowl',loc:'FreshBowl · Koramangala',manager:'Rekha Menon',approver:'—',
  stations:{Cook:['Grill','Fryer','Wok'],Server:['Counter']},catalog:['Food safety certificate'],
  cfg:{req:{},enforce:'enforce',alert:30,train:true,hours:true,cap:48,esc:'manager',auto:true,override:true},
  staff:[['Ananya Rao','Cook',['Grill','Wok'],34,{'Food safety certificate':'2027-08-14'}],['Ravi Nair','Cook',['Grill','Fryer'],30,{'Food safety certificate':'2027-03-02'}],
   ['Meera Shah','Cook',['Wok'],36,{'Food safety certificate':'2027-05-19'}],['Karthik Iyer','Cook',['Grill','Fryer','Wok'],45,{'Food safety certificate':'2027-01-09'}],
   ['Sana Khan','Server',['Counter'],28,{'Food safety certificate':'2027-06-30'}],['Imran Das','Cook',['Fryer'],32,{'Food safety certificate':'2026-10-12'}],
   ['Divya Menon','Cook',['Grill'],40,{}],['Arjun Reddy','Cook',['Grill','Wok'],26,{'Food safety certificate':'2027-09-01'}],['Neha Joshi','Server',['Counter'],30,{'Food safety certificate':'2027-02-11'}]],
  shifts:[[0,0,'Grill',8,18],[0,2,'Wok',8,18],[0,4,'Grill',6,17],[1,1,'Fryer',8,18],[2,3,'Wok',8,18],[3,0,'Grill',8,18],[6,2,'Grill',8,18],[7,5,'Wok',8,12],[4,1,'Counter',6,18],[5,4,'Fryer',8,18]],
  seed:[[3,7,'Yesterday 21:14'],[4,7,'Yesterday 21:40'],[5,6,'Yesterday 22:05'],[9,3,'Today 08:12'],[8,8,'Today 09:30']]},
 carepoint:{name:'CarePoint Clinics',loc:'CarePoint · Whitefield Clinic',manager:'Dr. Lata Pillai',approver:'—',
  stations:{Nurse:['OPD','Procedure room'],Receptionist:['Front desk']},catalog:['BLS','Nursing council registration'],
  cfg:{req:{Nurse:['BLS','Nursing council registration']},enforce:'enforce',alert:30,train:true,hours:true,cap:48,esc:'manager',auto:true,override:true},
  staff:[['Ananya Rao','Nurse',['OPD','Procedure room'],32,{'BLS':'2026-12-02','Nursing council registration':'2028-03-01'}],['Priya Menon','Nurse',['OPD'],36,{'BLS':'2026-10-28','Nursing council registration':'2028-01-15'}],
   ['Neha Verma','Nurse',['OPD','Procedure room'],30,{'BLS':'2027-06-10','Nursing council registration':'2029-02-01'}],['Kavya Iyer','Nurse',['OPD'],28,{'BLS':'2027-04-21'}],
   ['Rohit Joshi','Nurse',['OPD','Procedure room'],42,{'BLS':'2027-02-17','Nursing council registration':'2028-09-30'}],['Sameer Das','Receptionist',['Front desk'],30,{}],
   ['Tara Rao','Nurse',['Procedure room'],24,{'BLS':'2027-08-05','Nursing council registration':'2028-12-12'}],['Manoj Pillai','Nurse',['OPD'],38,{'BLS':'2027-01-28','Nursing council registration':'2029-04-04'}]],
  shifts:[[0,0,'OPD',8,8],[0,2,'Procedure room',8,8],[0,4,'OPD',6,14],[1,1,'OPD',8,8],[2,3,'Procedure room',8,8],[3,0,'OPD',8,8],[4,2,'Procedure room',8,14],[5,5,'Front desk',6,9],[6,3,'Procedure room',8,8],[7,4,'OPD',8,8]],
  seed:[[3,3,'Yesterday 21:14'],[4,4,'Yesterday 21:40'],[9,2,'Yesterday 22:05'],[6,6,'Today 08:12']]},
 urbanmart:{name:'UrbanMart',loc:'UrbanMart · Indiranagar Store',manager:'Suresh Kulkarni',approver:'Sunita Kapoor',
  stations:{'Store associate':['Floor','Stockroom'],Cashier:['Billing']},catalog:['First aid certificate'],
  cfg:{req:{},enforce:'enforce',alert:30,train:true,hours:true,cap:48,esc:'approver',auto:true,override:true},
  staff:[['Ananya Rao','Store associate',['Floor','Stockroom'],40,{}],['Ravi Nair','Store associate',['Floor'],44,{}],['Meera Shah','Store associate',['Floor','Stockroom'],38,{}],
   ['Karthik Iyer','Store associate',['Floor','Stockroom'],46,{}],['Sana Khan','Cashier',['Billing'],40,{}],['Imran Das','Store associate',['Stockroom'],36,{}],
   ['Divya Menon','Store associate',['Floor'],42,{}],['Arjun Reddy','Store associate',['Floor','Stockroom'],30,{}],['Neha Joshi','Cashier',['Billing'],44,{}]],
  shifts:[[0,0,'Floor',8,10],[0,2,'Stockroom',8,10],[0,4,'Floor',8,10],[1,1,'Floor',8,10],[2,3,'Stockroom',8,10],[3,0,'Floor',8,10],[6,2,'Floor',8,10],[7,5,'Floor',8,10],[4,1,'Billing',8,10],[5,4,'Stockroom',8,10],[8,3,'Billing',8,10]],
  seed:[[3,2,'Yesterday 21:14'],[5,6,'Yesterday 21:40'],[4,3,'Yesterday 22:05'],[9,7,'Today 08:12'],[8,8,'Today 09:30'],[7,5,'Today 09:55']]}
};
const OUT={auto:['Instant approval','c-auto'],mgr:['Manager decides','c-mgr'],appr:['Needs approver','c-appr'],block:['Not allowed','c-block']};

// =============== state ===============
let K='freshbowl', S, cfg, draft, reqs, seq, notifs, audit, ui, ICON={auto:'✓',mgr:'…',appr:'↑',block:'×'};
function load(k){
  K=k;const D=SC[k];
  S={...D,staff:D.staff.map((s,i)=>({id:i,n:s[0],r:s[1],st:[...s[2]],h:s[3],c:{...s[4]}})),
     shifts:D.shifts.map((s,i)=>({id:i,owner:s[0],day:s[1],station:s[2],len:s[3],start:s[4],role:D.staff[s[0]][1]}))};
  cfg=JSON.parse(JSON.stringify(D.cfg));draft=null;reqs=[];seq=0;notifs=[];audit=[];
  ui={persona:ui?ui.persona:'staff',staff:0,screen:'home',p:{},tab:'q',page:'overview'};
  D.seed.forEach(([sh,to,t])=>{const q=submit(S.shifts[sh].owner,to,sh,t,true);accept(q,true)});
  notifs=[];
}
const nm=id=>S.staff[id].n, first=id=>nm(id).split(' ')[0];
const shiftTxt=sh=>dlabel(sh.day)+', '+hh(sh.start)+'–'+hh(sh.start+sh.len)+' · '+sh.station;

// =============== rules engine ===============
function credState(exp,date,alert){
  if(!exp) return {k:'missing',d:null};
  const d=dd(date,exp); if(d<0) return {k:'expired',d};
  return {k:d<=alert?'soon':'ok',d};
}
// Release switch: which rules exist at each stage of the plan (1 = Sprint 1, 2 = Sprints 2-3, 4 = Sprint 4+)
let REL=4;
const E=c=>({...c,train:REL>=2&&c.train,auto:REL>=2&&c.auto,hours:REL>=4&&c.hours,esc:REL>=4?c.esc:'manager'});
function evaluate(shift,takerId,C,hoursOverride){
  C=E(C);
  const t=S.staff[takerId],date=iso(shift.day),checks=[];let fail=false,warn=false;
  const enforce=C.enforce==='enforce';
  if(REL>=2&&t.r!==shift.role){fail=true;checks.push({s:'fail',t:'Role',d:t.r+' cannot cover a '+shift.role+' shift'})}
  const clash=REL>=2&&S.shifts.find(x=>x.owner===takerId&&x.day===shift.day&&x.id!==shift.id);
  if(clash){fail=true;checks.push({s:'fail',t:'Schedule',d:'Already working '+hh(clash.start)+'–'+hh(clash.start+clash.len)+' that day'})}
  (C.req[t.r]||[]).forEach(n=>{
    const c=credState(t.c[n],date,C.alert);
    if(c.k==='missing'||c.k==='expired'){
      const txt=c.k==='missing'?'No record on file':'Expired '+(-c.d)+' days before the shift';
      if(enforce){fail=true;checks.push({s:'fail',t:n,d:txt})}else{warn=true;checks.push({s:'warn',t:n,d:txt+' (warn-only mode)'})}
    }else if(c.k==='soon')checks.push({s:'warn',t:n,d:'Valid on shift date, expires in '+c.d+' days'});
    else checks.push({s:'ok',t:n,d:'Valid until '+t.c[n]});
  });
  if(!(C.req[t.r]||[]).length)checks.push({s:'off',t:'Credentials',d:'None required for this role'});
  const trained=t.st.includes(shift.station);
  checks.push({s:C.train?(trained?'ok':'warn'):'off',t:'Training',d:C.train?(trained?'Trained at '+shift.station:'Not verified for '+shift.station):'Check is off'});
  const base=hoursOverride!=null?hoursOverride:t.h, proj=base+shift.len, over=C.hours&&proj>C.cap;
  checks.push({s:C.hours?(over?'warn':'ok'):'off',t:'Weekly hours',d:C.hours?proj+' h projected vs cap '+C.cap+(over?'. Above cap':''):'Check is off'});
  let out,reason;
  const bad=checks.filter(c=>c.s==='fail');
  if(fail){out='block';reason=bad.map(c=>c.t+': '+c.d).join('; ')}
  else if(over){out=C.esc==='approver'?'appr':'mgr';reason=proj+' h is above the '+C.cap+' h cap'}
  else if(warn){out='mgr';reason=checks.filter(c=>c.s==='warn'&&c.d.includes('warn-only')).map(c=>c.t).join(', ')+' not valid (warn-only mode)'}
  else if(C.train&&!trained){out='mgr';reason='Not verified for '+shift.station}
  else if(C.auto){out='auto';reason='All checks passed'}
  else{out='mgr';reason=REL<2?'Manual approval, as today':'Auto-approval is off'}
  return {out,reason,checks,proj,trained};
}
const apprName=()=>S.approver==='—'?'regional approver':S.approver;
const decider=ev=>ev.out==='appr'?apprName():S.manager;

// =============== workflow ===============
function note(who,ch,text){notifs.unshift({who,ch,text})}
function logA(actor,event,detail,qid){audit.unshift({t:ui&&ui._seed?'earlier':'just now',actor,event,detail,qid})}
function submit(from,to,shId,t,seed){
  const sh=S.shifts[shId];
  const q={id:++seq,shift:shId,from,to,status:'await',ev:null,t:t||'just now',by:null,snap:null,reason:null,log:[]};
  reqs.unshift(q);q.log.push(first(from)+' sent request');
  note(nm(to),'Push',first(from)+' asked you to take '+shiftTxt(sh)+'. Accept or decline.');
  return q;
}
function accept(q,quiet){
  const sh=S.shifts[q.shift];q.log.push(first(q.to)+' accepted');
  q.snap=S.staff[q.to].h;q.ev=evaluate(sh,q.to,cfg);q.rules='v'+(cfg.ver||1);
  logA('Rules engine','Decision: '+OUT[q.ev.out][0],first(q.from)+' → '+first(q.to)+', '+shiftTxt(sh)+'. '+q.ev.reason,q.id);
  if(q.ev.out==='auto'){apply(q,'Auto');return}
  q.status=q.ev.out==='block'?'blocked':q.ev.out;
  if(q.ev.out==='block'){
    note(nm(q.from),'Push','Swap not allowed: '+q.ev.reason+'.');
    const bad=q.ev.checks.find(c=>c.s==='fail');
    if(bad&&bad.t!=='Role'&&bad.t!=='Schedule')note(nm(q.to),'Push','Your '+bad.t+' is not valid. Renew it to be scheduled for '+S.staff[q.to].r.toLowerCase()+' shifts.');
  }else{
    const who=q.ev.out==='appr'?apprName():S.manager;
    q.log.push('Sent to '+who);
    note(nm(q.from),'Push','Sent to '+who+' for approval. '+q.ev.reason+'.');
    note(who,'Push','1 swap needs you: '+first(q.from)+' → '+first(q.to)+', '+dlabel(sh.day)+'.');
  }
}
function apply(q,by){
  const sh=S.shifts[q.shift];
  S.staff[q.from].h-=sh.len;S.staff[q.to].h+=sh.len;sh.owner=q.to;
  q.status='approved';q.by=by;q.log.push(by==='Auto'?'Approved automatically':'Approved by '+by);
  note(nm(q.from),'Push','Swap approved. '+dlabel(sh.day)+' now belongs to '+first(q.to)+'.');
  note(nm(q.to),'Push','Swap approved. You are working '+shiftTxt(sh)+'.');
}
function reject(q,why,by){q.status='rejected';q.by=by;q.reason=why;q.log.push('Rejected by '+by+': '+why);
  logA(by,'Rejected',first(q.from)+' → '+first(q.to)+'. Reason: '+why,q.id);
  note(nm(q.from),'Push','Swap rejected by '+by+': '+why+'.');note(nm(q.to),'Push','Swap cancelled: '+why+'.')}
function approve(q,by){logA(by,'Approved',first(q.from)+' → '+first(q.to),q.id);apply(q,by)}

const chip=(c,t)=>`<span class="chip ${c}">${t}</span>`;

const statusChip=q=>({await:chip('c-info','Waiting for '+first(q.to)),mgr:chip('c-mgr','With '+S.manager.split(' ')[0]),appr:chip('c-appr','With '+apprName().split(' ')[0]),
  blocked:chip('c-block','Not allowed'),approved:chip('c-auto',q.by==='Auto'?'Approved instantly':'Approved'),rejected:chip('c-block','Rejected'),declined:chip('c-mgr','Declined')}[q.status]);
function hoursBar(h,len,cap){const tot=h+len,max=Math.max(60,tot+4);
  return `<div class="hb"><i style="width:${Math.min(100,h/max*100)}%"></i><i style="left:${h/max*100}%;width:${len/max*100}%;background:${tot>cap?'#c98a0a':'#7f98e8'}"></i><u style="left:${cap/max*100}%"></u></div><div class="sub">${h} h scheduled + ${len} h shift = <b>${tot} h</b> · cap ${cap} h</div>`}

function phone(title,sub,body,nav,back){
  return `<div class="phone"><div class="sbar"><span>9:41</span><span>●●● 5G</span></div>
  <div class="appbar">${back?`<button class="back" data-act="back">‹ Back</button>`:''}<h3>${title}</h3>${sub?`<small>${sub}</small>`:''}</div>

function nav(items,cur){return `<div class="nav">${items.map(i=>`<button class="${cur===i[0]?'on':''}" data-act="tab" data-v="${i[0]}">${i[1]}${i[2]?`<span class="bd">${i[2]}</span>`:''}</button>`).join('')}</div>`}
function notes(title,sprint,paras,list){return `<div class="panel note"><h4>Design note</h4><span class="sp">${sprint}</span><b>${title}</b>${paras.map(p=>`<p>${p}</p>`).join('')}${list?`<ul>${list.map(l=>`<li>${l}</li>`).join('')}</ul>`:''}</div>`}
function stream(){return `<div class="panel"><h4>Notifications sent</h4>${notifs.length?notifs.slice(0,9).map(n=>`<div class="ev"><span class="ch">${n.ch}</span><b>${n.who}</b><i>${n.text}</i></div>`).join(''):'<div class="empty">Nothing yet. Actions in the app trigger push notifications here, so developers can see who is told what, and when.</div>'}</div>`}

    ${blocked.length?`<table><tr><th>Request</th><th>Why blocked</th><th></th></tr>${blocked.map(q=>`<tr><td>${first(q.from)} → ${first(q.to)}<br><span class="sub">${dlabel(S.shifts[q.shift].day)}</span></td><td>${q.ev.reason}</td><td>${cfg.override?`<button class="btn" data-act="ovr" data-v="${q.id}">Override</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">No blocked requests.</div>'}</div>
    <div class="sec"><h3>Credentials needing attention</h3>${soon.length?`<table>${soon.map(s=>`<tr><td>${s.n}</td><td>${(cfg.req[s.r]||[]).map(c=>{const x=credState(s.c[c],TODAY,cfg.alert);return x.k==='ok'?'':chip(x.k==='soon'?'c-appr':'c-block',c+': '+(x.k==='soon'?'expires in '+x.d+' d':x.k))}).join(' ')}</td></tr>`).join('')}</table>`:'<div class="empty">None. Add a required credential under Rules to track one.</div>'}</div></div>
    <div><div class="sec"><h3>Reference baseline</h3><p class="h">From the account data pack, Sept 2026.</p>${K==='freshbowl'?'38% of swaps approved within 24 h. Manager scheduling time 6.5 h/week.':K==='carepoint'?'71% approved within 24 h. Audit found two shifts covered by nurses with lapsed BLS.':'64% approved within 24 h. Overtime is 9% of the wage bill.'}</div>
    <div class="sec"><h3>This demo session</h3><p class="h">Counts update as you act in the other views.</p>${['auto','mgr','appr','block'].map(o=>`<div class="row" style="margin:3px 0">${outChip(o)}<b>${reqs.filter(q=>q.ev&&q.ev.out===o).length}</b></div>`).join('')}</div></div></div></div>`;
    n='Overview: head-office report, not an approval inbox';
  }else if(pg==='rules'){
    const d=draft||(draft=JSON.parse(JSON.stringify(cfg)));
    const rolesAvail=Object.keys(S.stations);
    const pv={auto:0,mgr:0,appr:0,block:0},base=reqs.filter(q=>q.snap!=null);
    base.forEach(q=>{pv[evaluate(S.shifts[q.shift],q.to,d,q.snap).out]++});
    const changed=JSON.stringify(d)!==JSON.stringify(cfg);
    main=`<div class="wm"><h2>Rules</h2><p class="lead">One rule set decides every shift assignment at ${S.name}. Edit a draft, preview the effect on past requests, then publish.</p>
    <div class="two"><div>
     <div class="sec"><h3>1 · Required credentials <span class="sp">Sprint 1</span></h3><p class="h">Blocks scheduling and swaps when a required credential is missing or expired on the shift date.</p>
      <table>${Object.entries(d.req).map(([r,l])=>l.map(c=>`<tr><td>${r}</td><td>${c}</td><td><button class="btn" data-act="rmReq" data-v="${r}|${c}">Remove</button></td></tr>`).join('')).join('')||'<tr><td class="empty">No credentials required.</td></tr>'}</table>
      <div class="f"><select id="addRole">${rolesAvail.map(r=>`<option>${r}</option>`).join('')}</select><select id="addCred">${S.catalog.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn" data-act="addReq">Add requirement</button></div>
      <div class="f"><label>Enforcement</label><label><input type="radio" name="enf" value="warn" ${d.enforce==='warn'?'checked':''} data-act="enf"> Warn only (14-day backfill)</label><label><input type="radio" name="enf" value="enforce" ${d.enforce==='enforce'?'checked':''} data-act="enf"> Enforce (block)</label></div>
      <div class="f"><label>Alert staff and managers</label><input type="number" id="alertD" value="${d.alert}" min="7" max="90" data-act="alert"><label>days before expiry</label></div>
      <div class="f"><label class="tg"><input type="checkbox" ${d.override?'checked':''} data-act="tgOverride"> Allow Admin override of blocks (always logged)</label></div></div>
     <div class="sec"><h3>2 · Training check <span class="sp">Sprint 2–3</span>${REL<2?" <span class=\"sub\">Not in this release</span>":""}</h3><div class="f"><label class="tg"><input type="checkbox" ${d.train?'checked':''} data-act="tgTrain" ${REL<2?"disabled":""}> Send to manager if the person is not trained for the station</label></div></div>
     <div class="sec"><h3>3 · Weekly hours cap <span class="sp">Sprint 4</span>${REL<4?" <span class=\"sub\">Not in this release</span>":""}</h3><div class="f"><label class="tg"><input type="checkbox" ${d.hours?'checked':''} data-act="tgHours" ${REL<4?"disabled":""}> Require approval above</label><input type="number" id="capIn" value="${d.cap}" min="20" max="80" data-act="cap" ${REL<4?"disabled":""}><label>hours a week</label></div>
      <div class="f"><label>Escalate to</label><select data-act="esc" ${REL<4?"disabled":""}><option value="manager" ${d.esc==='manager'?'selected':''}>Location manager</option><option value="approver" ${d.esc==='approver'?'selected':''}>Regional approver${S.approver!=='—'?' ('+S.approver+')':''}</option></select></div>
      <p class="h">Week runs Monday to Sunday and counts scheduled hours. Leave is excluded.</p></div>
     <div class="sec"><h3>4 · Auto-approval <span class="sp">Sprint 2–3</span>${REL<2?" <span class=\"sub\">Not in this release</span>":""}</h3><div class="f"><label class="tg"><input type="checkbox" ${d.auto?'checked':''} data-act="tgAuto" ${REL<2?"disabled":""}> Approve instantly when every check passes</label></div></div></div>
     <div><div class="sec impact"><h3>Impact preview</h3><p class="h">This draft applied to the ${base.length} requests decided in this demo.</p>
      <div class="imp"><div style="background:var(--auto-bg);color:var(--auto)"><b>${pv.auto}</b><span>Instant</span></div><div style="background:var(--mgr-bg);color:var(--mgr)"><b>${pv.mgr}</b><span>Manager</span></div><div style="background:var(--appr-bg);color:var(--appr)"><b>${pv.appr}</b><span>Approver</span></div><div style="background:var(--block-bg);color:var(--block)"><b>${pv.block}</b><span>Blocked</span></div></div>
      <p class="h">Today every one of these waits for the location manager.</p>
      <div class="btns"><button class="btn" data-act="discard" ${changed?'':'disabled'}>Discard</button><button class="btn pri" data-act="publish" ${changed?'':'disabled'}>Publish rules</button></div>
      <p class="h" style="margin-top:8px">Publishing applies to new requests. Each decision stores the rule version it used. Rollout is behind a feature flag per account (Sprint 5).</p></div></div></div></div>`;
    n='Rules: one page, four rules, preview before publish';
  }else{
    main=`<div class="wm"><h2>Audit log</h2><p class="lead">Every decision, override and rejection, with the actor and the reason. Built for auditors.</p><div class="sec">
    ${audit.length?`<table><tr><th>When</th><th>Actor</th><th>Event</th><th>Detail</th></tr>${audit.map(a=>`<tr><td>${a.t}</td><td>${a.actor}</td><td><b>${a.event}</b></td><td>${a.detail}</td></tr>`).join('')}</table>`:'<div class="empty">No events yet. Send a swap from the Staff view.</div>'}</div></div>`;
    n='Audit log: the answer to "show us the control"';
  }
  const np=notes(n,pg==='rules'?'Sprints 1–5':'Sprint 1',[pg==='audit'?'This is what CarePoint\'s compliance head shows an auditor: who was blocked, why, and who overrode it.':pg==='rules'?'Admins see the consequence of a rule change before it goes live. Warn-only mode lets a customer backfill credential data without blocking anyone on day one.':'Admin work is reading and configuring, a few times a month, on the web.']);
  return `<div class="stage wide"><div><div class="web"><div class="wbar"><i></i><i></i><i></i><span>app.shiftwell.in/${pg}</span></div><div class="wgrid">${side}${main}</div></div><div style="margin-top:12px">${np}</div></div>${stream()}</div>`;
}

// =============== SPEC ===============
function specView(){
  return `<div class="spec">
  <div class="panel"><h2>Handoff spec</h2><p class="sub">What the views imply, for design and engineering. Sprints are two weeks from 19 Oct 2026: S1 credential gate, S2–3 rules engine, S4 hours cap and approver, S5 rollout, S6 buffer.</p>

  <h3>1 · What changes for each role</h3>
  <table><tr><th style="width:16%">Role</th><th style="width:38%">Today</th><th>New</th></tr>
  <tr><td><b>Staff</b></td><td>Agree a swap on WhatsApp, request it in the app, wait about a day. Half the time they skip the app.</td><td>See who is eligible before asking. Decision in seconds when rules pass. Clear reason and next step when they do not.</td></tr>
  <tr><td><b>Location manager</b></td><td>Approves every swap, mostly without thinking. Checks training, overtime and certificates by hand, sometimes in Excel.</td><td>Sees only exceptions, each with the reason. Credentials and training live in the app.</td></tr>
  <tr><td><b>Regional approver</b></td><td>Does not exist.</td><td>Sees only swaps above the hours cap. Same card and actions as the manager.</td></tr>
  <tr><td><b>Admin</b></td><td>Reads reports. No control over how swaps are decided.</td><td>Sets the rules, previews their effect, overrides blocks with a reason, shows auditors the log.</td></tr></table>

  <h3>2 · Release scope</h3>
  <table><tr><th style="width:15%">Release</th><th style="width:44%">Live for users</th><th>Not yet</th></tr>
  <tr><td><b>S1</b> · Oct 19–30</td><td>Credential field per staff and role. Block at scheduling. Swaps into an expired certificate cannot be approved. Staff and manager expiry alerts. Admin override with a basic log. Warn-only mode, then enforce.</td><td>Pre-checks for staff, auto-approval, hours cap.</td></tr>
  <tr><td><b>S2–3</b> · Nov 2–27</td><td>Rules engine: role, clash, credential, training. Colleague picker with eligibility. Auto-approval. Exception queue. Decision log. FreshBowl pilot.</td><td>Hours cap, approver.</td></tr>
  <tr><td><b>S4</b> · Nov 30–Dec 11</td><td>Hours cap rule, regional approver inbox, escalation setting. Roster build shows a warning above the cap.</td><td>Approval at roster publish (stretch).</td></tr>
  <tr><td><b>S5</b> · Dec 14–25</td><td>Rule preview, versioned publish, feature flag per account, hardening and manager training.</td><td></td></tr></table>
  <p class="sub">Use the Release switch at the top to see the product at each stage. The 1-sprint estimate for S1 covers the field and the scheduling block. Swap-time enforcement for every swap arrives with the engine in S2–3.</p>

  <h3>3 · Decision rules, evaluated in this order</h3>
  <table><tr><th>#</th><th>Check</th><th>Result</th><th>Staff sees</th><th>From</th></tr>
  <tr><td>1</td><td>Role mismatch, or clash with another shift that day</td><td>Blocked</td><td>"Already working 08:00–16:00 that day"</td><td>S2–3</td></tr>
  <tr><td>2</td><td>Required credential missing or expired <b>on the shift date</b></td><td>Blocked when enforced; manager when warn-only</td><td>"BLS: expired 25 days before the shift"</td><td>S1</td></tr>
  <tr><td>3</td><td>Projected weekly hours above cap</td><td>Approver, or manager if none is set</td><td>"Sent to Sunita. 54 h is above the 48 h cap"</td><td>S4</td></tr>
  <tr><td>4</td><td>Not trained for the station</td><td>Manager</td><td>"Not verified for Grill"</td><td>S2–3</td></tr>
  <tr><td>5</td><td>All pass</td><td>Auto-approve; manager if auto is off</td><td>"Approved instantly"</td><td>S2–3</td></tr></table>
  <p class="sub">Missing data never passes silently. A missing credential blocks once enforced. Unknown training goes to a person.</p></div>

  <div class="grid2"><div class="panel"><h3>4 · Notifications</h3><table><tr><th>Event</th><th>Who is told</th></tr>
  <tr><td>Swap requested</td><td>Colleague</td></tr><tr><td>Approved, including auto</td><td>Both staff. Manager sees it in Activity, no push.</td></tr>
  <tr><td>Needs a decision</td><td>Manager or approver. Requester is told who has it.</td></tr>
  <tr><td>Blocked</td><td>Requester (reason). Credential owner (renew).</td></tr><tr><td>Rejected</td><td>Both staff, with the reason</td></tr>
  <tr><td>Credential expiring</td><td>Staff and manager, 30 days before (configurable)</td></tr></table>
  <p class="sub">All sends go through one channel interface: push and SMS first. WhatsApp becomes another adapter, not a redesign.</p>
  <h3>States to design on every screen</h3><ul class="sub"><li>Loading and offline (queue cached, actions retry)</li><li>Empty ("All clear", no requests yet)</li><li>Send error, with retry</li><li>Colleague silent for 24 h: request expires, requester told</li></ul></div>

  <div class="panel"><h3>5 · Data model (v1)</h3><table><tr><th>Entity</th><th>Key fields</th></tr>
  <tr><td><code>Credential</code></td><td>staff_id, type, expiry_date, updated_by</td></tr>
  <tr><td><code>RoleRequirement</code></td><td>account_id, role, credential_type</td></tr>
  <tr><td><code>RuleSet</code></td><td>account_id, version, enforce_mode, alert_days, train_gate, hours_cap, escalate_to, auto_approve</td></tr>
  <tr><td><code>SwapRequest</code></td><td>shift_id, from_id, to_id, status, accepted_at, decided_by</td></tr>
  <tr><td><code>Decision</code></td><td>request_id, rule_version, checks[], outcome, actor, reason</td></tr>
  <tr><td><code>Approver</code></td><td>account_id, user_id, location_ids[]</td></tr></table>
  <h3>Open questions for Engineering</h3><ul class="sub">
  <li>Engine estimate (planning figure: 2 sprints, range 1.5 to 3) and reuse of existing notification infrastructure.</li>
  <li>A swap changes hours for both people. The demo checks the taker; production checks both.</li>
  <li>A rule changes while a request is pending: decide with the version live at acceptance.</li>
  <li>Week boundary and leave: assumed Mon–Sun, leave excluded. UrbanMart to confirm.</li>
  <li>Staff at more than one location: hours summed across locations.</li>
  <li>Approver silent: no auto-escalation in v1.</li></ul></div></div>
  <div class="panel"><h3>6 · Success metrics and instrumentation</h3>
  <table><tr><th style="width:18%">Level</th><th style="width:34%">Metric</th><th>Events to log</th></tr>
  <tr><td><b>North star</b></td><td>% of swaps decided within 24 h (FreshBowl baseline 38%)</td><td><code>swap_requested</code>, <code>swap_decided</code> with timestamps</td></tr>
  <tr><td><b>Drivers</b></td><td>Share auto-approved. Time in the exception queue.</td><td><code>decision.outcome</code>, <code>queue_entered</code>, <code>queue_decided</code></td></tr>
  <tr><td><b>Guardrails</b></td><td>Valid staff wrongly blocked. Overrides per month. Wrong auto-approvals reported by managers.</td><td><code>override_created</code> with reason, <code>manager_flag_auto</code></td></tr>
  <tr><td><b>Outcome</b></td><td>Expired-credential shifts worked (target 0). Overtime share of wage bill. Renewal of at-risk accounts.</td><td><code>credential_expired_assignment</code>, weekly hours snapshot</td></tr></table>
  <p class="sub">Off-app swaps are a blind spot. Track swaps per staff member against the pre-launch baseline as a proxy.</p></div></div>`;
}

// =============== render + events ===============
const PERSONAS=[['staff','Staff · mobile'],['manager','Location manager · mobile'],['approver','Regional approver · mobile'],['admin','Admin · web'],['spec','Handoff spec']];
function render(){
  $('#persona').innerHTML=PERSONAS.map(p=>`<button class="${ui.persona===p[0]?'on':''}" data-act="persona" data-v="${p[0]}">${p[1]}</button>`).join('');
  $('#app').innerHTML=ui.persona==='staff'?staffView():ui.persona==='manager'?mgrView('manager'):ui.persona==='approver'?mgrView('approver'):ui.persona==='admin'?adminView():specView();
  if(ui.persona!=='spec'){const h=document.querySelector('.stage>div:first-child');if(h)h.insertAdjacentHTML('afterbegin',walk())}
  const as=$('#asSel');if(as)as.onchange=e=>{ui.staff=+e.target.value;ui.screen='home';render()};
}
const WALK={
 freshbowl:[['Staff: pick a colleague for the Wed Wok shift','staff',{screen:'pick',p:{shift:1}},'Meera and Arjun clear instantly. Karthik (45 h) and Ravi (not trained on Wok) need the manager.'],
   ['Manager: only exceptions reach the queue','manager',{tab:'q'},'The banner counts what rules cleared. Approve or review a card.'],
   ['Admin: change a rule, preview, publish','admin',{page:'rules'},'Lower the hours cap and watch the impact preview move before publishing.'],
   ['Handoff spec','spec',{},'Decision table, release scope, data model.']],
 carepoint:[['Staff: certificate banner before it lapses','staff',{screen:'home'},'Ananya\'s BLS expires in 12 days. Warned early, not caught by an auditor.'],
   ['Staff: expired colleagues cannot be picked','staff',{screen:'pick',p:{shift:1}},'Reasons are in plain words. Try the Sprint 1 release to see the check happen later.'],
   ['Admin: override a block, with a reason','admin',{page:'overview'},'Only Admin can override. The reason goes to the audit log.'],
   ['Admin: audit log','admin',{page:'audit'},'The answer to "show us the control".']],
 urbanmart:[['Staff: pick a colleague who would go over 48 h','staff',{screen:'pick',p:{shift:1}},'Meera would reach 54 h. Send the request and use the demo shortcut to accept.'],
   ['Approver: only over-cap swaps arrive','approver',{tab:'q'},'Sunita sees the hours bar and approves in one tap.'],
   ['Admin: set the cap and who escalates to','admin',{page:'rules'},'48 h is a setting, not a custom build.'],
   ['Handoff spec','spec',{},'Release scope shows this arrives in Sprint 4.']]};
function walk(){
  return `<div class="panel" style="margin-bottom:12px"><h4>Guided walkthrough · ${S.name}</h4>${WALK[K].map((w,i)=>`<button class="btn" style="width:100%;text-align:left;margin-bottom:6px" data-act="walk" data-v="${i}"><b>${i+1}.</b> ${w[0]}<div class="sub" style="font-weight:400">${w[3]}</div></button>`).join('')}</div>`;
}
function go(screen,p){ui.screen=screen;ui.p=p||{};render()}
function modalOvr(q){
  $('#modalRoot').innerHTML=`<div class="modal"><div class="box"><h3 style="margin:0 0 6px">Override block</h3><p class="sub">${first(q.from)} → ${first(q.to)}: ${q.ev.reason}</p>
  <div class="f"><textarea id="ovrWhy" rows="3" style="width:100%" placeholder="Reason (required, goes to the audit log)"></textarea></div>
  <div class="btns"><button class="btn" data-act="closeM">Cancel</button><button class="btn pri" data-act="doOvr" data-v="${q.id}">Override and approve</button></div></div></div>`;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'&&el.type!=='button')return;
  const a=el.dataset.act,v=el.dataset.v;
  if(el.disabled)return;
  if(a==='walk'){const w=WALK[K][+v];ui.staff=0;ui.persona=w[1];ui.screen=w[2].screen||'home';ui.p=w[2].p||{};ui.tab=w[2].tab||'q';if(w[2].page)ui.page=w[2].page;render()}
  else if(a==='persona'){ui.persona=v;ui.screen='home';ui.p={};ui.tab='q';render()}
  else if(a==='tab'){if(v==='x')return;ui.screen='home';ui.tab=v;ui.p={};if(v==='home'||v==='swaps'){ui.screen=v}render()}
  else if(a==='back'){ui.screen=ui.persona==='staff'?'home':'home';ui.p={};render()}
  else if(a==='pick')go('pick',{shift:+v});
  else if(a==='confirm')go('confirm',{shift:ui.p.shift,to:+v});
  else if(a==='send'){const q=submit(ui.staff,ui.p.to,ui.p.shift);go('status',{q:q.id})}
  else if(a==='open'){const q=reqs.find(r=>r.id===+v);if(ui.persona==='staff')go('status',{q:q.id});else go('detail',{q:q.id})}
  else if(a==='acceptDemo'){const q=reqs.find(r=>r.id===+v);accept(q);go('status',{q:q.id})}
  else if(a==='acceptReal'){const q=reqs.find(r=>r.id===+v);accept(q);toast('Accepted. Rules decided: '+OUT[q.ev.out][0]);render()}
  else if(a==='decline'){const q=reqs.find(r=>r.id===+v);q.status='declined';note(nm(q.from),'Push',first(q.to)+' declined your request.');render()}
  else if(a==='approveQ'){const q=reqs.find(r=>r.id===+v);approve(q,ui.persona==='approver'?apprName():S.manager);toast('Approved. Both staff notified.');ui.screen='home';ui.p={};render()}
  else if(a==='rejectAsk'){ui.p.rej=true;render()}
  else if(a==='rejectQ'){const[id,why]=v.split('|');reject(reqs.find(r=>r.id===+id),why,ui.persona==='approver'?apprName():S.manager);toast('Rejected');ui.screen='home';ui.p={};render()}
  else if(a==='member')go('member',{m:+v});
  else if(a==='station'){const[id,st]=v.split('|'),s=S.staff[+id];s.st=s.st.includes(st)?s.st.filter(x=>x!==st):[...s.st,st];render()}
  else if(a==='page'){ui.page=v;render()}
  else if(a==='ovr')modalOvr(reqs.find(r=>r.id===+v));
  else if(a==='closeM')$('#modalRoot').innerHTML='';
  else if(a==='doOvr'){const w=$('#ovrWhy').value.trim();if(!w){$('#ovrWhy').style.borderColor='#b42318';return}const q=reqs.find(r=>r.id===+v);
    logA('Admin','Override of block',first(q.from)+' → '+first(q.to)+'. Reason: '+w,q.id);apply(q,'Admin override');$('#modalRoot').innerHTML='';toast('Override logged');render()}
  else if(a==='addReq'){const r=$('#addRole').value,c=$('#addCred').value;(draft.req[r]=draft.req[r]||[]);if(!draft.req[r].includes(c))draft.req[r].push(c);render()}
  else if(a==='rmReq'){const[r,c]=v.split('|');draft.req[r]=draft.req[r].filter(x=>x!==c);if(!draft.req[r].length)delete draft.req[r];render()}
  else if(a==='discard'){draft=null;render()}
  else if(a==='publish'){draft.ver=(cfg.ver||1)+1;cfg=draft;draft=null;logA('Admin','Rules published','Version '+cfg.ver+': cap '+cfg.cap+' h, '+(cfg.enforce==='enforce'?'enforce':'warn-only')+', auto-approve '+(cfg.auto?'on':'off'));toast('Rules v'+cfg.ver+' published');render()}
});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.act;if(!a)return;
  if(a==='cred'){const[id,c]=el.dataset.v.split('|');S.staff[+id].c[c]=el.value||undefined;render();return}
  if(!draft)return;
  if(a==='enf')draft.enforce=el.value;else if(a==='alert')draft.alert=+el.value||30;else if(a==='cap')draft.cap=Math.max(20,Math.min(80,+el.value||48));
  else if(a==='esc')draft.esc=el.value;else if(a==='tgOverride')draft.override=el.checked;else if(a==='tgTrain')draft.train=el.checked;
  else if(a==='tgHours')draft.hours=el.checked;else if(a==='tgAuto')draft.auto=el.checked;else return;
  render();
});
$('#scSel').innerHTML=Object.entries(SC).map(([k,s])=>`<option value="${k}">${s.name}</option>`).join('');
$('#scSel').onchange=e=>{load(e.target.value);render()};
$('#relSel').onchange=e=>{REL=+e.target.value;load(K);render();toast('Showing the product as of '+e.target.selectedOptions[0].text)};
$('#resetBtn').onclick=()=>{load(K);render();toast('Demo reset')};
load('freshbowl');render();
</script>
</body>
</html>
